version: "3.4"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appkernel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./.containers/db:/var/lib/postgresql/data
    ports:
      - "5432:5432" # 不想對外開 DB 就刪掉
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  web-api:
    image: ${DOCKER_REGISTRY-}webapi
    container_name: web-api
    build:
      context: .
      dockerfile: src/Web.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-appkernel};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};Pooling=true;
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      # 如果你程式有用 redis/seq 的設定，也建議用 env 明確注入
      # Redis__ConnectionString: redis:6379
      # Seq__ServerUrl: http://seq:5341
    ports:
      - "5000:5000"
      # - "5001:5001"  # 先不要開，除非你已處理 Kestrel HTTPS 憑證
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: migrate
    working_dir: /src
    volumes:
      - ./:/src
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-appkernel};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};Pooling=true;
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -lc "dotnet tool install --global dotnet-ef --version 9.* &&
                export PATH=$PATH:/root/.dotnet/tools &&
                dotnet ef database update --project src/Infrastructure --startup-project src/Web.Api"
    restart: "no"

  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"
      - "18080:80"

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest
    container_name: aspire-dashboard
    ports:
      - "18888:18888"
